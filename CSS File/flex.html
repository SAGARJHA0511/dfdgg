<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex Box</title>
    <style>
        #container1{
            text-align: center;

        }
        #div{
            background-color: blanchedalmond;
            height: 300px;
            /* width: 600px; */
            border: 2px solid;
            margin: 10px;
            padding: 20px;
            display: flex;
            flex-direction: column;
             

        }
        .box{
            height: 70px;
            width: 70px;
            margin: 5px;
            text-align: center;
            border: 1px solid;
           
            
        }
    
        #box1{background-color: rgb(227, 75, 25);}
        #box2{background-color: rgb(143, 143, 206);}
        #box3{background-color: rgb(61, 247, 185);}
        #box4{background-color: rgb(237, 149, 35);}

    </style>
</head>
<body>
    <h1 id="container1">Flex Box</h1>
    <div id="div">
    <div id="box1" class="box">Box1</div>
    <div id="box2" class="box">Box2</div>
    <div id="box3" class="box">Box3</div>
    <div id="box4" class="box">Box4</div>
    </div>
</body>
</html>
