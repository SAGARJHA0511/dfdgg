<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Property</title>
    <style>
        .colorproperty1{
            color: burlywood;
            background-color: black;
        }
        .colorproperty2{
            color: aqua;
            background-color: rgb(152, 40, 40);
        }
    </style>
</head>
<body>
    <h1 class="colorproperty1">This Color Property</h1>
    <p class="colorproperty2">Lorem ipsum, dolor sit amet consectetur adipisicing elit. Autem, suscipit.</p>
    <br><hr>

    <h1 style="color:blueviolet">Inline Styling</h1>
    <p style="font-size: larger;">Lorem ipsum dolor sit amet consectetur adipisicing elit. Velit, laboriosam.</p>
</body>
</html>
