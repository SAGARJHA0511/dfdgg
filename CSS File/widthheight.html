<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Width & Height </title>
    <style>
        .box{
            height: 50px; width: 80px;
        }
        #b1{
            color: Red; background-color: bisque;
        }
        #b2{
            color: green; background-color: bisque;
        }
        #b3{
            color: blue; background-color: bisque;
        }
    </style>
</head>
<body>
    <h1 id="b1" class="box">Box 1</h1> <br>
    <h1 id="b2" class="box">Box 2</h1> <br>
    <h1 id="b3" class="box">Box 3</h1> <br>
</body>
</html>
