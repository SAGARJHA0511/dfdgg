<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid</title>
    <style>
        #con{
            background-color: bisque;
            height: 300px;
            width: 600px;
            text-align: center;
            border: 2px solid;
            
            
        }
        .box{
            height: 60px;
            width: 90px;
            margin: 10px;
            

        }
        #item1{
            background-color: rgb(49, 193, 193);
            grid-row: 1 / 2;
            
        }

         #item2{
            background-color: rgb(90, 118, 118);
            grid-row: 1 / 2;
        }
         #item3{
            background-color: rgb(62, 156, 53);
        }
         #item4{
            background-color: rgb(198, 147, 37);
        }
       

    </style>
</head>
<body>
    <h1 style="text-align: center;">Grid Container</h1>
    <div id="con">
    <div id="item1" class="box">1 Box</div>
    <div id="item2" class="box">2 Box</div>
    <div id="item3" class="box">3 Box</div>
    <div id="item4" class="box">4 Box</div>
    </div>
</body>
</html>
