<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Background Color</title>
    <style>
        *{
            margin: 0; padding: 0;
        }
           #water {
            color: black; background-color: aqua;
           }
           #para {
            color: black; background-color: rgba(255, 255, 0);
           }
           button {
               color: black; background-color: grey;
           }
           h2{
            background-color: rgba(255, 0, 0, 0.2);
           }
    </style>

</head>
<body>
    <h1 id="water">The wonderla! The water park...</h1><hr>
    <p id="para">Lorem ipsum dolor sit amet.</p><hr>
    <button>Click Me</button><hr><br><br>
    <h2>Color</h2>
</body>
</html>
