<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animation</title>
    <style>
        div{
            background-color: rgb(127, 240, 13);
            height: 70px;
            width: 70px;
            margin: 50px;
            padding: 20px;
            border-radius: 60px;
            position: relative;

            animation: animate 2s ease-in-out 1s alternate;
        }
       @keyframes animate {
            from {left: 10px;}
            to {left: 600px;}
       }

       h1{
            background-color: rgb(186, 225, 148);
            height: 70px;
            width: 70px;
            margin: 50px;
            padding: 20px;
            border-radius: 60px;
            position: relative;

            animation: hoja 2s ease-in-out 1s infinite alternate;
       }

       @keyframes hoja {
        from {left: 10px;}
        to {left: 600px;}
        
       }
    </style>
</head>
<body>
    <div>Animeat</div>
    <h1>hoja</h1>
</body>
</html>
