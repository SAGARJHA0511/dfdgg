<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pseudo Class</title>
    <style>
        #div{
            background-color: yellow;
            height: 200px;
            width: 600px;
            display: flex;
            justify-content: center;
            align-items: center;

        }

        #btn{
            background-color: rgb(127, 195, 195);
            height: 50px;
            width: 100px;
            border: 2px solid;
            border-radius: 30px;

            transition-property: all;
            transition-duration: 1s;
            transition-timing-function: ease-in-out;
            transition-delay: 4s;

            
        }
        #btn:hover{
            
            background-color: burlywood;
            border: 9px solid rgb(112, 14, 78);
            
            
        }
        #btn:active{
            height: 60px;
            width: 110px;
              border: 7px solid green;
              background-color: aqua;
        }
    </style>
</head>
<body>
    <div id="div"><button id="btn">Click Me..!</button></div>

   
    
</body>
</html>
