<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ID & Class Selectors</title>
    <style>
        #styleid{
            color: hotpink;

        }
        .multiple{
            color: chartreuse;
        }
        div p{
            color: aqua;
        }
    </style>
</head>
<body>
    <h1 id="styleid">ID Selectors are used to target a specific element</h1>
    <h2 class="multiple">The Class selector is used to style multiple elements</h2>
    <p class="multiple">Lorem ipsum, dolor sit amet consectetur adipisicing elit. Et, quia!</p>
    <div>
        <p>Para 1</p>
        <p>Para 2</p>
    </div>
    <p>Para 3</p>
</body>
</html>
