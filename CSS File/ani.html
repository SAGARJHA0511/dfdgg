<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Small</title>
    <style>
      .progress {
    background-color: rgb(187, 228, 228);
    height: 500px;
    width: 300px;
    position: relative;
    left: 200px;
    top: 100px;
    border: 1px solid;
    border-radius: 20px;
    /* overflow: hidden; */
}

.ani_progress {
    background-color: aqua;
    width: 100%;
    /* height: 0; */
    position: absolute;
    bottom: 0;
    border-radius: 20px;

    animation: water 2s infinite alternate;
}

@keyframes water {
    0% {
        height: 0;
    }


    100% {
        height: 60%;
    }
}
    </style>
</head>
<body>
    <div class="progress">
        <div class="ani_progress"></div>
    </div>
    
</body>
</html>
